services:
  - type: web
    name: myciti-bus-timetable
    env: python
    region: frankfurt  # or oregon/singapore based on preference
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn fastapi_app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: ESP_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11
    healthCheckPath: /
    autoDeploy: true

# Optional: If you want to rebuild the database on deploy
