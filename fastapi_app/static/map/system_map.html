<!DOCTYPE html>
<!--
  Interactive MyCiTi system map — FastAPI version.

  Leaflet map over Cape Town with schematic/street toggle.
  Fetches network data from /api/map/network and navigates to stop pages on click.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  body     { margin:0; padding:0; background:transparent;
             font-family:"Source Sans Pro",-apple-system,sans-serif; }
  #wrap    { position:relative; width:100%; height:700px; }
  #map     { width:100%; height:100%; border-radius:10px; }
  #legend  { box-sizing:border-box; position:absolute; top:10px; right:10px; width:215px; max-height:80%;
             overflow-y:auto; background:rgba(17,17,17,.94); color:#F0F0F0;
             border-radius:10px; padding:10px 12px; font-size:12px; z-index:1000;
             box-shadow:0 2px 12px rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.08); }
  #legend h4 { margin:6px 0 3px; font-size:11px; text-transform:uppercase;
               letter-spacing:.06em; color:#A0A0A8; }
  .lrow    { display:flex; align-items:center; gap:6px; padding:2px 4px;
             border-radius:5px; cursor:pointer; line-height:1.25; }
  .lrow:hover { background:rgba(255,255,255,.06); }
  .lrow.active { background:rgba(200,255,0,.18); }
  .swatch  { flex:0 0 22px; height:5px; border-radius:2px; }
  .rid     { flex:0 0 34px; font-weight:700; }
  #style-toggle { position:absolute; top:10px; left:54px; z-index:1000;
                  background:#111111; border-radius:8px; overflow:hidden;
                  box-shadow:0 2px 12px rgba(0,0,0,.45); display:flex;
                  border:1px solid rgba(255,255,255,.08); }
  #style-toggle button { border:none; padding:7px 12px; font-size:12px;
                         cursor:pointer; background:#111111; color:#F0F0F0; }
  #style-toggle button.on { background:#C8FF00; color:#0A0A0A; font-weight:700; }
  #hint    { position:absolute; left:10px; bottom:10px; color:#A0A0A8;
             font-size:11px; background:rgba(17,17,17,.9);
             padding:4px 8px; border-radius:6px; z-index:1000;
             border:1px solid rgba(255,255,255,.08); }
  #reset   { margin-top:8px; width:100%; padding:4px; border:none; border-radius:6px;
             background:#2A2A32; color:#F0F0F0; cursor:pointer; font-size:12px; }
  #reset:hover { background:#3A3A44; }
  .hub-label { background:transparent; border:none; box-shadow:none;
               font-weight:700; font-size:10px; color:#F0F0F0;
               text-shadow:0 0 3px #000, 0 0 3px #000, 0 0 3px #000; }

  #preview-bar { display:none; position:absolute; left:54px; top:48px; z-index:1000;
                 max-width:min(360px, calc(100% - 80px));
                 background:rgba(17,17,17,.96); color:#F0F0F0;
                 border-radius:8px; padding:8px 10px; font-size:12px; line-height:1.35;
                 box-shadow:0 2px 12px rgba(0,0,0,.45);
                 border:1px solid rgba(255,255,255,.08); }
  #preview-bar .cap { font-weight:700; margin:0 0 2px; }
  #preview-bar .cap-opt { color:#A0A0A8; margin:0 0 6px; font-size:11px; }
  #preview-bar .meta { color:#A0A0A8; font-size:11px; margin:0 0 6px; }
  #preview-clear { border:none; background:#2A2A32; color:#F0F0F0; border-radius:6px;
                   padding:4px 10px; cursor:pointer; font-size:12px; }
  #preview-clear:hover { background:#3A3A44; }
  .ghost-label { background:rgba(17,17,17,.92); border:1px dashed #A0A0A8;
                 color:#F0F0F0; font-size:11px; font-weight:700; padding:2px 6px;
                 border-radius:4px; box-shadow:none; }
  #loading { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
             background:rgba(17,17,17,.95); color:#F0F0F0; padding:20px; border-radius:10px;
             box-shadow:0 2px 12px rgba(0,0,0,.45); z-index:2000;
             border:1px solid rgba(255,255,255,.08); }
  /* Legend collapse on phones (<=480px): starts closed behind a toggle */
  #legend-toggle { display:none; position:absolute; top:10px; right:10px; z-index:1001;
                   background:#111111; color:#F0F0F0; border:1px solid rgba(255,255,255,.08);
                   border-radius:8px; padding:7px 12px; font-size:12px; font-weight:700;
                   cursor:pointer; box-shadow:0 2px 12px rgba(0,0,0,.45); }
  #legend-toggle[aria-expanded="true"] { background:#C8FF00; color:#0A0A0A; }
  #legend-toggle:focus-visible { outline:2px solid #C8FF00; outline-offset:2px; }
  @media (max-width:480px) {
    #legend-toggle { display:block; }
    #legend { display:none; top:48px; width:min(240px, calc(100% - 20px)); max-height:60%; }
    #wrap.legend-open #legend { display:block; }
  }
  .leaflet-tile-pane { filter:invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9); }
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <div id="loading">Loading network map...</div>
  <div id="style-toggle" style="display:none;">
    <button id="btn-schematic" class="on">Schematic</button>
    <button id="btn-street">Street</button>
  </div>
  <button type="button" id="legend-toggle" aria-controls="legend" aria-expanded="false">Legend</button>
  <div id="legend"></div>
  <div id="preview-bar" role="status" aria-live="polite">
    <p class="cap" id="preview-cap"></p>
    <p class="cap-opt" id="preview-cap-opt"></p>
    <p class="meta" id="preview-meta"></p>
    <button type="button" id="preview-clear">Clear preview</button>
  </div>
  <div id="hint">Click a stop to view its timetable · click a route to highlight</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---- Legend toggle (phones start collapsed; desktop always shows legend) ----
(function () {
  const wrap = document.getElementById("wrap");
  const btn = document.getElementById("legend-toggle");
  btn.addEventListener("click", function () {
    const open = !wrap.classList.contains("legend-open");
    wrap.classList.toggle("legend-open", open);
    btn.setAttribute("aria-expanded", String(open));
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape" || !wrap.classList.contains("legend-open")) return;
    wrap.classList.remove("legend-open");
    btn.setAttribute("aria-expanded", "false");
    btn.focus();
  });
})();

// ---- Fetch network data and initialize map ----
fetch('/api/map/network')
  .then(response => {
    if (!response.ok) throw new Error('Network data fetch failed');
    return response.json();
  })
  .then(graph => {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('style-toggle').style.display = 'flex';
    initMap(graph);
  })
  .catch(error => {
    document.getElementById('loading').textContent = 'Error loading map: ' + error.message;
    console.error('Map loading error:', error);
  });

// ---- octilinear "square-ish" elbow between two stops ----------------------
function elbow(a, b) {
  const k  = Math.cos(a[0] * Math.PI / 180);
  const ax = a[1] * k, ay = a[0], bx = b[1] * k, by = b[0];
  const dx = bx - ax, dy = by - ay;
  const t  = Math.min(Math.abs(dx), Math.abs(dy));
  if (t < 1e-9) return [a, b];
  const mx = ax + Math.sign(dx) * t;
  const my = ay + Math.sign(dy) * t;
  return [a, [my, mx / k], b];
}

// ---- the map itself --------------------------------------------------------
function initMap(graph) {
  const color = Object.fromEntries(graph.routes.map(r => [r.id, r.color]));
  const nodeById = Object.fromEntries(graph.nodes.map(n => [n.id, n]));

  const map = L.map("map", { zoomSnap: 0.25 }).setView([-33.92, 18.55], 10);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
               + ' · stops &copy; City of Cape Town',
    maxZoom: 19,
  }).addTo(map);

  const bounds = L.latLngBounds(graph.nodes.map(n => [n.lat, n.lon])).pad(0.05);
  let fitted = false;
  function tryFit() {
    if (document.getElementById("map").clientWidth > 50) {
      map.invalidateSize();
      if (!fitted) { fitted = true; map.fitBounds(bounds); }
    }
  }
  tryFit();
  new ResizeObserver(tryFit).observe(document.getElementById("map"));

  // --- schematic layer: octilinear elbows between consecutive stops ---
  const schematicLines = [];
  const schematicLayer = L.layerGroup();
  for (const l of graph.links) {
    const a = nodeById[l.source], b = nodeById[l.target];
    if (!a || !b) continue;
    const line = L.polyline(elbow([a.lat, a.lon], [b.lat, b.lon]), {
      color: color[l.route], weight: 3, opacity: 0.9, interactive: false,
    });
    line._route = l.route;
    schematicLines.push(line);
    schematicLayer.addLayer(line);
  }

  // --- street layer: the city's real route geometries ---
  const streetLines = [];
  const streetLayer = L.layerGroup();
  for (const [rid, paths] of Object.entries(graph.paths)) {
    for (const path of paths) {
      const line = L.polyline(path, {
        color: color[rid], weight: 3, opacity: 0.9, interactive: false,
      });
      line._route = rid;
      streetLines.push(line);
      streetLayer.addLayer(line);
    }
  }
  // Routes missing from the city layer still need street-mode lines
  const withPaths = new Set(Object.keys(graph.paths));
  for (const l of graph.links) {
    if (withPaths.has(l.route)) continue;
    const a = nodeById[l.source], b = nodeById[l.target];
    if (!a || !b) continue;
    const line = L.polyline([[a.lat, a.lon], [b.lat, b.lon]], {
      color: color[l.route], weight: 3, opacity: 0.9,
      dashArray: "6 4", interactive: false,
    });
    line._route = l.route;
    streetLines.push(line);
    streetLayer.addLayer(line);
  }

  schematicLayer.addTo(map);

  // --- stop markers (Design: map-stop-markers.md) ---
  map.createPane("stops");
  map.getPane("stops").style.zIndex = 650;

  function stopBucket(n) {
    if (n.n >= 6) return { radius: 7, fillColor: "#ffffff", weight: 2.5 };
    if (n.n >= 3) return { radius: 6, fillColor: "#ffffff", weight: 2 };
    return { radius: 5, fillColor: color[n.routes[0]], weight: 2 };
  }

  const markers = [];
  let stickyId = null;
  let stickyTimer = null;
  function clearSticky() {
    stickyId = null;
    if (stickyTimer) { clearTimeout(stickyTimer); stickyTimer = null; }
  }
  map.on("movestart", clearSticky);

  function fromTouch(e) {
    const oe = e && e.originalEvent;
    if (oe && oe.pointerType === "touch") return true;
    if (oe && oe.touches && oe.touches.length) return true;
    return window.matchMedia("(pointer: coarse)").matches;
  }

  function goTimetable(stopId) {
    window.parent.location.href = `/stop/${encodeURIComponent(stopId)}`;
  }

  for (const n of graph.nodes) {
    const st = stopBucket(n);
    const halo = L.circleMarker([n.lat, n.lon], {
      pane: "stops",
      radius: st.radius + 2,
      fillColor: "#ffffff",
      fillOpacity: 0.95,
      stroke: false,
      interactive: false,
    }).addTo(map);
    const m = L.circleMarker([n.lat, n.lon], {
      pane: "stops",
      radius: st.radius,
      fillColor: st.fillColor,
      fillOpacity: 1,
      color: "#1a1a1a",
      weight: st.weight,
    }).addTo(map);
    m._node = n;
    m._halo = halo;
    const tipHtml =
      `<b>${n.id}</b><br><span style="color:#0072BC">${n.routes.join(" · ")}</span>` +
      `<br><span style="color:#888">Tap for timetable</span>`;
    m.bindTooltip(tipHtml, { direction: "top", offset: [0, -6], sticky: false });
    if (n.n >= 6) {
      L.tooltip({
        permanent: true, direction: "top", offset: [0, -10],
        className: "hub-label", pane: "stops",
      }).setContent(n.id).setLatLng([n.lat, n.lon]).addTo(map);
    }
    m.on("click", (e) => {
      if (fromTouch(e)) {
        if (stickyId === n.id) {
          clearSticky();
          goTimetable(n.id);
          return;
        }
        clearSticky();
        stickyId = n.id;
        m.openTooltip();
        stickyTimer = setTimeout(() => {
          stickyId = null;
          stickyTimer = null;
          m.closeTooltip();
        }, 2500);
        return;
      }
      goTimetable(n.id);
    });
    markers.push(m);
  }
  // --- schematic / street toggle ---
  const btnS = document.getElementById("btn-schematic");
  const btnT = document.getElementById("btn-street");
  function setStyle(mode) {
    btnS.classList.toggle("on", mode === "schematic");
    btnT.classList.toggle("on", mode === "street");
    if (mode === "schematic") { map.removeLayer(streetLayer); schematicLayer.addTo(map); }
    else                      { map.removeLayer(schematicLayer); streetLayer.addTo(map); }
  }
  btnS.onclick = () => setStyle("schematic");
  btnT.onclick = () => setStyle("street");

  // --- legend with click-to-highlight ---
  let active = null;
  function applyHighlight() {
    for (const line of [...schematicLines, ...streetLines]) {
      line.setStyle({ opacity: !active || line._route === active ? 0.9 : 0.06 });
    }
    for (const m of markers) {
      const on = !active || m._node.routes.includes(active);
      const op = on ? 1 : 0.2;
      m.setStyle({ fillOpacity: on ? 1 : 0.2, opacity: op });
      if (m._halo) {
        m._halo.setStyle({ fillOpacity: on ? 0.95 : 0.2, opacity: on ? 0.95 : 0.2 });
      }
    }
    document.querySelectorAll(".lrow").forEach(el =>
      el.classList.toggle("active", el.dataset.route === active));
  }

  const legend = document.getElementById("legend");
  for (const cat of ["Trunk", "Direct", "Area"]) {
    const routes = graph.routes.filter(r => r.category === cat);
    if (!routes.length) continue;
    const h = document.createElement("h4");
    h.textContent = cat + " routes";
    legend.appendChild(h);
    for (const r of routes) {
      const row = document.createElement("div");
      row.className = "lrow";
      row.dataset.route = r.id;
      row.innerHTML = `<div class="swatch" style="background:${r.color}"></div>
                       <div class="rid" style="color:${r.color}">${r.id}</div>
                       <div>${r.name.replace(/^[^–]+– /, "")}</div>`;
      row.onclick = () => { active = active === r.id ? null : r.id; applyHighlight(); };
      legend.appendChild(row);
    }
  }
  const reset = document.createElement("button");
  reset.id = "reset";
  reset.textContent = "Show all routes";
  reset.onclick = () => { active = null; applyHighlight(); };
  legend.appendChild(reset);

  // --- Trip preview (deliberate only; never from legend/stop click) ---
  maybeStartPreview(map, color);
}

function clearPreviewQuery() {
  try {
    const u = new URL(window.location.href);
    ["preview","route_id","direction","day_type","board","alight","dep","arr"].forEach(k => u.searchParams.delete(k));
    const next = u.pathname + (u.search ? u.search : "") + u.hash;
    window.history.replaceState({}, "", next);
    // Parent /map page may own the query — ask it to clear too
    if (window.parent && window.parent !== window) {
      try {
        const pu = new URL(window.parent.location.href);
        ["preview","route_id","direction","day_type","board","alight","dep","arr"].forEach(k => pu.searchParams.delete(k));
        window.parent.history.replaceState({}, "", pu.pathname + (pu.search ? pu.search : "") + pu.hash);
      } catch (e) { /* cross-origin: ignore */ }
    }
  } catch (e) { /* ignore */ }
}

function maybeStartPreview(map, colorByRoute) {
  const params = new URLSearchParams(window.location.search);
  if (params.get("preview") !== "1") return;
  const route_id = params.get("route_id");
  const direction = params.get("direction");
  const day_type = params.get("day_type");
  const board = params.get("board");
  const alight = params.get("alight");
  const dep = params.get("dep");
  if (!route_id || !direction || !day_type || !board || !alight || !dep) return;

  const q = new URLSearchParams({
    route_id, direction, day_type, board, alight, dep,
  });
  const arr = params.get("arr");
  if (arr) q.set("arr", arr);

  fetch("/api/trip-preview?" + q.toString())
    .then(r => { if (!r.ok) throw new Error("preview fetch failed"); return r.json(); })
    .then(data => {
      if (!data.eligible) {
        console.info("Trip preview hidden:", data.hide_reason);
        return;
      }
      showTripPreview(map, data);
    })
    .catch(err => console.error("Trip preview error:", err));
}

function showTripPreview(map, data) {
  if (!map._previewPane) {
    map.createPane("preview");
    map.getPane("preview").style.zIndex = 700;
    map._previewPane = true;
  }
  const layers = [];
  const path = L.polyline(data.path, {
    pane: "preview",
    color: data.ghost_color,
    weight: 4,
    opacity: 0.55,
    dashArray: "6 8",
    interactive: false,
  }).addTo(map);
  layers.push(path);

  const ghost = L.circleMarker([data.ghost.lat, data.ghost.lon], {
    pane: "preview",
    radius: 9,
    color: data.ghost_color,
    weight: 2,
    dashArray: "4 3",
    fillColor: data.ghost_color,
    fillOpacity: data.ghost_opacity || 0.45,
  }).addTo(map);
  ghost.bindTooltip(data.caption, {
    permanent: true, direction: "top", offset: [0, -10], className: "ghost-label",
  });
  layers.push(ghost);

  map.fitBounds(path.getBounds(), { padding: [40, 40], maxZoom: 14 });

  const bar = document.getElementById("preview-bar");
  const compliance = "Estimated from timetable — not live GPS.";
  document.getElementById("preview-cap").textContent = compliance;
  const opt = document.getElementById("preview-cap-opt");
  const bits = [];
  if (data.outside_window) bits.push("Outside trip window — showing scheduled start/end");
  if (data.caption_optional) bits.push(data.caption_optional);
  opt.textContent = bits.join(" · ");
  document.getElementById("preview-meta").textContent =
    data.route_id + " · " + data.dep + "–" + data.arr + " · " + data.geometry_source + " path · as of " + data.now;
  bar.style.display = "block";

  function tearDown() {
    layers.forEach(l => { try { map.removeLayer(l); } catch (e) {} });
    bar.style.display = "none";
    clearPreviewQuery();
  }
  document.getElementById("preview-clear").onclick = tearDown;
  // Leaving the map page dismisses; within iframe, parent navigation covers it.
  map._clearTripPreview = tearDown;
}

</script>
</body>
</html>
